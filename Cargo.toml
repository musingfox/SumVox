[package]
name = "sumvox"
version = "1.9.0"
edition = "2021"
authors = ["Nick Huang"]
description = "Intelligent voice notifications for AI coding tools - LLM-powered summarization with TTS"
license = "MIT"
repository = "https://github.com/musingfox/sumvox"
homepage = "https://github.com/musingfox/sumvox"
keywords = ["voice", "notification", "ai", "tts", "llm", "claude"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "macos-system-configuration"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
async-trait = "0.1"
shellexpand = "3"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
nix = { version = "0.29", features = ["fs", "user"] }
rand = "0.8"
jsonwebtoken = "9"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"  # Optimize for size

[[bin]]
name = "sumvox"
path = "src/main.rs"
